# Tropical Cyclone Spatiotemporal Forecaster & 3D Simulation Configuration
project_name: "cyclone_spatiotemporal_forecaster"
seed: 42

# Data & Model Paths
paths:
  simulation_html: "src/visualization/cyclone_3d_simulation.html"
  sequence_model_v2_dir: "models/sequence_model_v2"
  checkpoint_v2: "models/sequence_model_v2/best_sequence_model_v2.pt"
  output_eval_dir: "models/sequence_model_v2/evaluation_plots_v2"
  simulation_results_dir: "models/sequence_model_v2/simulation_results"

# Cyclone Classification Categories (IMD / WMO standard based on sustained wind speed in knots)
categories:
  - id: 0
    name: "Depression"
    code: "D"
    min_knots: 0
    max_knots: 33
    description: "Low intensity depression (winds up to 33 kt / 61 km/h)"
  - id: 1
    name: "Cyclonic Storm"
    code: "CS"
    min_knots: 34
    max_knots: 47
    description: "Moderate cyclone, spiral bands forming (34-47 kt / 62-88 km/h)"
  - id: 2
    name: "Severe Cyclonic Storm"
    code: "SCS"
    min_knots: 48
    max_knots: 63
    description: "Gale force winds, distinct curved cloud band (48-63 kt / 89-117 km/h)"
  - id: 3
    name: "Very Severe Cyclonic Storm"
    code: "VSCS"
    min_knots: 64
    max_knots: 89
    description: "Developing/visible eye wall structure (64-89 kt / 118-166 km/h)"
  - id: 4
    name: "Extremely Severe / Super Cyclone"
    code: "SuCS"
    min_knots: 90
    max_knots: 250
    description: "Well-defined central dense overcast & clear eye (>= 90 kt / >= 167 km/h)"

# Spatiotemporal Multi-Task Architecture Configuration
sequence_model_v2:
  sequence_length: 4           # 4 consecutive hourly frames [t-3, t-2, t-1, t]
  synoptic_size: 224           # Full cloud canopy synoptic view (1000 km)
  core_crop_ratio: 0.25        # High-resolution central eyewall core crop
  spatial_backbone: "convnext_tiny"
  temporal_engine: "gru"
  hidden_dim: 256
  num_classes: 5
  dropout: 0.20
  asymmetric_loss_weight: 2.5  # Safety penalty multiplier for underestimating severe storms

# Physical Normalization Constants
normalization:
  wind_mean: 50.0
  wind_std: 25.0
  pres_mean: 985.0
  pres_std: 20.0
  danger_r30_max: 500.0        # Max gale radius in km
  danger_r50_max: 250.0        # Max storm radius in km

# 3D Simulation & Server Configuration
simulation:
  port: 8055
  default_scenario: "ditwah"
  time_steps: [-18, -12, -6, 0, 3, 6, 9, 12, 18, 24]
